[project]
site_name = "OpenScofo"
site_url = "https://charlesneimog.github.io/OpenScofo"
docs_dir = "Documentation"
copyright = "Copyright &copy 2026 | Charles K. Neimog"
hooks = ["Documentation/copy-editor.py"]
repo_url = "https://github.com/charlesneimog/OpenScofo"
edit_uri = "edit/main/Documentation/"
nav = [
  "index.md",
  { "Score" = [
    "score/intro.md",
    "score/fundaments.md",
    "score/conventions.md",
    "score/config.md",
    "score/events.md",
    "score/actions.md",
    "score/lua.md",
  ] },
  { "Listening Module" = [
    "descriptors/index.md",
    "descriptors/amplitude.md",
    "descriptors/onset.md",
    "descriptors/spectral.md",
    "descriptors/ai.md",
  ] },
  { "Integrations / Download" = [
    "integrations/index.md",
    "integrations/puredata.md",
    "integrations/max.md",
    "integrations/vamp.md",
    "integrations/supercollider.md",
    "integrations/csound.md",
    "integrations/python.md",
    "integrations/javascript.md",
    "integrations/cpp.md",
  ] },
  { "OpenScofo Online Editor" = "https://charlesneimog.github.io/OpenScofo/Editor/" },
]

extra_javascript = [
  { path = "javascript/vexflow.mjs" },
  { path = "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js" },
  { path = "javascript/download-links.js" },


]
extra_css = [
  "stylesheets/extra.css",
  "https://unpkg.com/katex@0/dist/katex.min.css",
]

[project.theme]
custom_dir = "Documentation/overrides"
logo = "assets/favicon.svg"
favicon = "assets/logo.svg"
name = "material"
features = [
  "navigation.top",
  "navigation.sections",
  "navigation.footer",
  "content.code.annotate",
  "content.code.copy",
  "navigation.tabs",
  "search.highlight",
  "search.suggest",
  "toc.integrate",
  "toc.follow",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.tabs.sticky",
  "navigation.expand",
  "content.tabs.link",
  "content.footnote.tooltips",
  # Preview
  "navigation.instant",
  "navigation.instant.progress",
]

[project.extra]
logo_dark_mode = "assets/favicon-dark.svg"
logo_light_mode = "assets/favicon.svg"

[project.theme.icon.admonition]
equation = "custom/equation"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ╭──────────────────────────────────────╮
# │              EXTENSIONS              │
# ╰──────────────────────────────────────╯
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true

# Emojis
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["Documentation/overrides/.icons"]

# Code blocks
[project.markdown_extensions.pymdownx.highlight]
extend_pygments_lang = [
  { name = "openscofo", lang = "openscofo", options = {} },
]

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

# Admonition
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Preview
[project.markdown_extensions.zensical.extensions.preview]
configurations = [{ targets.include = ["score/*"] }]

