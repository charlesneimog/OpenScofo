---
name: Compile Binaries
on:
    push:
        tags:
            - "**"
    workflow_dispatch:
permissions:
    contents: write
env:
    LIBNAME: openscofo~
jobs:
    build:
        timeout-minutes: 180
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            SCCACHE_CACHE_SIZE: 2G
            SCCACHE_GHA_VERSION: ${{ matrix.os }}-pd${{ matrix.precision }}-trainer-v2
            SCCACHE_CACHE_MULTIARCH: "1"
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, macos-latest, windows-2022]
                # os: [windows-2022]
                precision: [32]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.9

            - name: Reset sccache stats
              run: python Resources/CI/ci.py --reset-sccache

            - name: Install FFmpeg (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  choco install ffmpeg -y
                  echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

            - name: Setup Emscripten
              if: runner.os == 'Linux'
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: latest

            - name: Setup MSVC environment
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Install dependencies
              env:
                  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
              run: python Resources/CI/ci.py --install-dependencies
            - name: Cache Qt Installer Framework (Linux)
              if: runner.os == 'Linux'
              id: cache-qtifw
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/QtIFW-4.8.1
                  key: qtifw-linux-x64-4.8.1

            - name: Install Qt Installer Framework (Linux)
              if: runner.os == 'Linux' && steps.cache-qtifw.outputs.cache-hit != 'true'
              run: python Resources/CI/ci.py --install-qt-framework

            - name: Build
              run: python Resources/CI/ci.py --build --precision ${{ matrix.precision }}

            - name: Run native tests
              run: python Resources/CI/ci.py --run-native-tests

            - name: Verify native Pure Data trainer
              run: python Resources/CI/ci.py --verify-native-trainer

            - name: Repair Linux wheel
              if: runner.os == 'Linux'
              run: python Resources/CI/ci.py --repair-linux-wheel

            - name: Build Emscripten
              if: runner.os == 'Linux'
              run: python Resources/CI/ci.py --build-emscripten

            - name: Show sccache stats
              if: always()
              run: python Resources/CI/ci.py --show-sccache-stats

            - name: Extract version from wheel
              id: wheel_version
              run: python Resources/CI/ci.py --extract-wheel-version
            - name: Generate Component Installer
              run: python Resources/CI/ci.py --generate-installer
            - name: Validate installer files
              run: python Resources/CI/ci.py --files-test
            - name: Smoke test Linux installer
              if: runner.os == 'Linux'
              run: python Resources/CI/ci.py --smoke-test-installer
            - name: Stage Max package payload
              if: runner.os == 'macOS' || runner.os == 'Windows'
              run: python Resources/CI/ci.py --stage-max-package
            - name: Stage Pure Data package payload
              run: python Resources/CI/ci.py --stage-puredata-package
            # -----------------------
            # Upload artifacts
            # -----------------------
            - name: Upload Installer
              uses: actions/upload-artifact@v6
              with:
                  name: Installer-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: |
                      *.pkg
                      *.msi
                      *.sh
                      *.run
                  if-no-files-found: error
            - name: Upload Python Wheel
              uses: actions/upload-artifact@v6
              with:
                  name: Python-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: dist/*.whl

            - name: Upload Max Package Payload
              if: runner.os == 'macOS' || runner.os == 'Windows'
              uses: actions/upload-artifact@v6
              with:
                  name: MaxPackagePart-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: max-package
                  if-no-files-found: error

            - name: Upload Pure Data Package Payload
              uses: actions/upload-artifact@v6
              with:
                  name: PdPackagePart-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: pd-package
                  if-no-files-found: error

            - name: Upload Emscripten
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v6
              with:
                  name: Emscripten-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-Linux
                  path: |
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo.js
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo.wasm
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo*.worker.js
                  if-no-files-found: error

            - name: Publish Pip
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              continue-on-error: true
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: python Resources/CI/ci.py --publish-pypi
    publish-release:
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Extract release version from artifacts
              id: release_metadata
              shell: bash
              run: |
                  set -euo pipefail
                  mapfile -t wheels < <(find artifacts -type f -name '*.whl' | sort)
                  if [[ "${#wheels[@]}" == "0" ]]; then
                    echo "ERROR: No Python wheel artifacts found"
                    exit 1
                  fi
                  release_version=""
                  for wheel in "${wheels[@]}"; do
                    wheel_name="$(basename "$wheel")"
                    wheel_stem="${wheel_name%.whl}"
                    version="${wheel_stem#*-}"
                    version="${version%%-*}"
                    if [[ -z "$release_version" ]]; then
                      release_version="$version"
                    elif [[ "$version" != "$release_version" ]]; then
                      echo "ERROR: wheel version mismatch: $wheel_name has $version, expected $release_version"
                      exit 1
                    fi
                  done
                  if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
                    release_tag="${GITHUB_REF_NAME}"
                    tag_version="${release_tag#v}"
                    if [[ "$tag_version" != "$release_version" ]]; then
                      echo "ERROR: tag $release_tag does not match built version $release_version"
                      exit 1
                    fi
                  else
                    release_tag="v${release_version}"
                  fi
                  echo "Extracted RELEASE_VERSION=$release_version from Python wheel artifacts"
                  echo "Using RELEASE_TAG=$release_tag"
                  echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
                  echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
                  echo "version=$release_version" >> "$GITHUB_OUTPUT"
                  echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            - name: Create per-artifact zip archives
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release_assets
                  for artifact_dir in artifacts/*; do
                    [ -d "$artifact_dir" ] || continue
                    name="$(basename "$artifact_dir")"
                    if [[ "$name" == MaxPackagePart-* ]]; then
                      continue
                    fi
                    if [[ "$name" == PdPackagePart-* ]]; then
                      continue
                    fi
                    (cd "$artifact_dir" && zip -r "../../release_assets/${name}.zip" .)
                  done
                  linux_installer="$(find artifacts -type f -path '*/Installer-*-Linux/OpenScofo-Linux.run' -print -quit)"
                  if [[ -z "$linux_installer" || ! -s "$linux_installer" ]]; then
                    echo "ERROR: Missing or empty OpenScofo-Linux.run artifact."
                    exit 1
                  fi
                  cp "$linux_installer" release_assets/OpenScofo-Linux.run
                  test -s release_assets/OpenScofo-Linux.run
                  ls -1 release_assets
            - name: Create Max-only package zip
              shell: bash
              run: |
                  set -euo pipefail
                  mac_part="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'MaxPackagePart-*-macOS' | sort | head -n 1)"
                  win_part="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'MaxPackagePart-*-Windows' | sort | head -n 1)"
                  if [[ -z "$mac_part" || -z "$win_part" ]]; then
                    echo "ERROR: Missing Max package payload artifacts."
                    echo "mac_part=$mac_part"
                    echo "win_part=$win_part"
                    exit 1
                  fi
                  mkdir -p max_release
                  cp -R "$mac_part/OpenScofo" max_release/
                  mkdir -p max_release/OpenScofo/externals
                  cp "$win_part/OpenScofo/externals/openscofo~.mxe64" max_release/OpenScofo/externals/
                  cp "$win_part/OpenScofo/externals/openscofo.train.mxe64" max_release/OpenScofo/externals/
                  test -f max_release/OpenScofo/docs/openscofo~.maxref.xml
                  test -f max_release/OpenScofo/help/openscofo~.maxhelp
                  test -f max_release/OpenScofo/help/openscofo.train.maxhelp
                  test -f max_release/OpenScofo/help/canticos.mp3
                  test -f max_release/OpenScofo/help/canticos.scofo
                  test -f max_release/OpenScofo/help/flute.onnx
                  test -f max_release/OpenScofo/extras/OpenScofo.maxpat
                  test -f max_release/OpenScofo/externals/openscofo~.mxo/Contents/MacOS/openscofo~
                  test -f max_release/OpenScofo/externals/openscofo.train.mxo/Contents/MacOS/openscofo.train
                  test -f max_release/OpenScofo/externals/openscofo~.mxe64
                  test -f max_release/OpenScofo/externals/openscofo.train.mxe64
                  (cd max_release && zip -r "../release_assets/Max-openscofo-${RELEASE_VERSION}.zip" OpenScofo)
                  ls -lh "release_assets/Max-openscofo-${RELEASE_VERSION}.zip"
            - name: Package and upload Pure Data release to Deken
              shell: bash
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  set -euo pipefail
                  mkdir -p "deken_release/${LIBNAME}"
                  found_pd_part=0
                  for pd_part in artifacts/PdPackagePart-*; do
                    [ -d "$pd_part" ] || continue
                    if [[ ! -d "$pd_part/${LIBNAME}" ]]; then
                      echo "ERROR: Pure Data artifact does not contain ${LIBNAME}: $pd_part"
                      find "$pd_part" -maxdepth 3 -type f -print
                      exit 1
                    fi
                    cp -R "$pd_part/${LIBNAME}/." "deken_release/${LIBNAME}/"
                    found_pd_part=1
                  done
                  if [[ "$found_pd_part" != "1" ]]; then
                    echo "ERROR: No Pure Data package payload artifacts found."
                    find artifacts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
                    exit 1
                  fi
                  shopt -s nullglob
                  staged_binaries=(deken_release/"${LIBNAME}"/openscofo~*)
                  found_binary=0
                  for binary in "${staged_binaries[@]}"; do
                    if [[ -f "$binary" && "$binary" != *.pd ]]; then
                      found_binary=1
                    fi
                  done
                  if [[ "$found_binary" != "1" ]]; then
                    echo "ERROR: No Pure Data external binary found in merged Deken payload."
                    find "deken_release/${LIBNAME}" -maxdepth 1 -type f -print | sort
                    exit 1
                  fi
                  staged_trainers=(deken_release/"${LIBNAME}"/openscofo.train*)
                  found_trainer=0
                  for trainer in "${staged_trainers[@]}"; do
                    if [[ -f "$trainer" && "$trainer" != *.pd ]]; then
                      found_trainer=1
                    fi
                  done
                  if [[ "$found_trainer" != "1" ]]; then
                    echo "ERROR: No openscofo.train binary found in merged Deken payload."
                    find "deken_release/${LIBNAME}" -maxdepth 1 -type f -print | sort
                    exit 1
                  fi
                  find "deken_release/${LIBNAME}" -maxdepth 1 -type f -print | sort
                  (
                    cd deken_release
                    docker run --rm \
                      --user "$(id -u)" \
                      --volume "$(pwd):/deken" \
                      registry.git.iem.at/pd/deken \
                      deken package \
                        --version "${RELEASE_VERSION}" \
                        "${LIBNAME}"
                    dek_files=(./*.dek)
                    if [[ "${dek_files[*]}" != *"(Darwin-"* ]]; then
                      echo "ERROR: Deken package is missing the Darwin architecture."
                      printf '%s\n' "${dek_files[@]}"
                      exit 1
                    fi
                    ls -lh ./*.dek
                    cp ./*.dek ../release_assets/
                    docker run --rm \
                      --user "$(id -u)" \
                      --volume "$(pwd):/deken" \
                      -e DEKEN_USERNAME -e DEKEN_PASSWORD \
                      registry.git.iem.at/pd/deken \
                      deken upload \
                        --no-source-error \
                        -v "${RELEASE_VERSION}" \
                        ./*.dek
                  )
            - name: Generate release notes
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  current_tag="${RELEASE_TAG}"
                  previous_tag=""
                  previous_target=""
                  release_info="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                    --jq "(map(select(.tag_name != \"${current_tag}\")) | .[0]) // {} | [.tag_name // \"\", .target_commitish // \"\"] | @tsv" \
                    || true)"
                  if [[ -n "$release_info" && "$release_info" != "null" ]]; then
                    previous_tag="$(printf '%s' "$release_info" | cut -f1)"
                    previous_target="$(printf '%s' "$release_info" | cut -f2)"
                  fi
                  git fetch --tags --force
                  previous_ref=""
                  if [[ -n "$previous_tag" ]] && git rev-parse --verify --quiet "${previous_tag}^{commit}" >/dev/null; then
                    previous_ref="$previous_tag"
                  elif [[ -n "$previous_target" ]] && git rev-parse --verify --quiet "${previous_target}^{commit}" >/dev/null; then
                    previous_ref="$previous_target"
                  else
                    previous_ref="$(git describe --tags --abbrev=0 --exclude "$current_tag" 2>/dev/null || true)"
                  fi
                  {
                    echo "## Changes"
                    echo
                    if [[ -n "$previous_ref" ]]; then
                      echo "Commits from \`${previous_tag:-$previous_ref}\` to \`${current_tag}\`."
                      range="${previous_ref}..${GITHUB_SHA}"
                    else
                      echo "Commits included in \`${current_tag}\`."
                      range="${GITHUB_SHA}"
                    fi
                    echo
                    if [[ "$(git rev-list --count "$range")" == "0" ]]; then
                      echo "No commits found since the previous release."
                    else
                      git log --reverse \
                        --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s%n%w(0,2,2)%b%n" \
                        "$range"
                    fi
                  } > release_notes.md
                  cat release_notes.md
            - name: Create draft GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "ERROR: Release $RELEASE_TAG already exists; refusing to overwrite it."
                    exit 1
                  fi
                  gh release create "$RELEASE_TAG" --verify-tag --draft \
                    --title "$RELEASE_TAG" --notes-file release_notes.md

            - name: Upload GitHub Release Assets
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  release_tag="${{ steps.release_metadata.outputs.tag }}"
                  shopt -s nullglob
                  release_files=(release_assets/*)
                  if [[ "${#release_files[@]}" == "0" ]]; then
                    echo "ERROR: No release assets found in release_assets/"
                    exit 1
                  fi
                  gh release upload "$release_tag" "${release_files[@]}"
            - name: Publish GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh release edit "${{ steps.release_metadata.outputs.tag }}" --draft=false
