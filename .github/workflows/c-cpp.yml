name: Compile Binaries
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish Release"
        required: false
        default: false
        type: boolean

env:
  LIBNAME: OpenScofo
  LIBVERSION: 0.1.7
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_GHA_VERSION: ${{ matrix.os }}-pd${{ matrix.precision }}
      SCCACHE_CACHE_MULTIARCH: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        #os: [macos-latest, windows-latest]
        precision: [32]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Setup Emscripten
        if: runner.os == 'Linux'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # -----------------------
      # Linux dependencies
      # -----------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo add-apt-repository ppa:pure-data/pure-data -y
          sudo apt install puredata -y
          sudo apt install libboost-all-dev libgtest-dev python3-pybind11 -y
          npm install -g tree-sitter-cli
          pip install build scikit-build-core cibuildwheel twine
      # -----------------------
      # macOS dependencies
      # -----------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pd pybind11 googletest tree-sitter boost
          npm install -g tree-sitter-cli
          pip install build scikit-build-core cibuildwheel twine
      # -----------------------
      # Windows dependencies
      # -----------------------
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install -g tree-sitter-cli
          winget install -e --id LLVM.LLVM --accept-source-agreements --accept-package-agreements
          winget install -e --id MillerPuckette.PureData --accept-source-agreements
          choco install wixtoolset --no-progress -y
          $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          if (Test-Path $wixBin) {
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          python -m pip install --upgrade pip
          python -m pip install build scikit-build-core cibuildwheel twine pybind11
      # -----------------------
      # Configure (Unix)
      # -----------------------
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m build --wheel \
            -Cbuild-dir=build \
            -Ccmake.define.PD_FLOATSIZE=${{ matrix.precision }} \
            -Ccmake.define.CMAKE_BUILD_TYPE=Release \
            -Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
            -Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -Ccmake.define.CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -Ccmake.define.OSCOFO_BUILD_TESTS=OFF \
            -Ccmake.define.PD_LIB_DIR="${{ github.workspace }}/${{ env.LIBNAME }}" \
            -Ccmake.define.CMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -Ccmake.define.BUILD_ALL=ON \
            -Ccmake.args="-G Ninja"
      # -----------------------
      # Configure (Windows)
      # -----------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pybind11Dir = python -m pybind11 --cmakedir
          $treeSitterBin = (Get-Command tree-sitter.cmd).Source
          $buildArgs = @(
            "-Cbuild-dir=build"
            "-Ccmake.define.PD_FLOATSIZE=${{ matrix.precision }}"
            "-Ccmake.define.CMAKE_BUILD_TYPE=Release "
            "-Ccmake.define.pybind11_DIR=$pybind11Dir"
            "-Ccmake.define.TREE_SITTER_EXECUTABLE=$treeSitterBin"
            "-Ccmake.define.CMAKE_C_COMPILER=clang"
            "-Ccmake.define.CMAKE_CXX_COMPILER=clang++"
            "-Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache"
            "-Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache"
            "-Ccmake.define.OSCOFO_BUILD_TESTS=OFF"
            "-Ccmake.define.PD_LIB_DIR=${{ github.workspace }}/${{ env.LIBNAME }}"
            "-Ccmake.define.BUILD_ALL=ON"
            "-Ccmake.args=-G Ninja"
          )
          python -m build --wheel @buildArgs
      - name: Build Emscripten
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_VERSION: ${{ matrix.os }}-pd${{ matrix.precision }}-wasm
        run: |
          source $EMSDK/emsdk_env.sh
          emcmake cmake . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DOSCOFO_BUILD_TESTS=OFF \
            -DBUILD_ALL=ON
          cmake --build build-wasm

      - name: Repair Linux wheels
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python -m pip install auditwheel
          auditwheel repair dist/*.whl -w dist/
          rm dist/*-linux_*.whl


      - name: Generate macOS Component Installer
        if: runner.os == 'macOS'
        run: |
          python Resources/Packages/macos.py \
            --version ${{ env.LIBVERSION }} \
            --output OpenScofo-${{ env.LIBVERSION }}-macOS.pkg

      - name: Generate Windows Component Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue)
          $light = (Get-Command light.exe -ErrorAction SilentlyContinue)

          if (-not $candle -or -not $light) {
            $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.11\bin'
            $candlePath = Join-Path $wixBin 'candle.exe'
            $lightPath = Join-Path $wixBin 'light.exe'
          } else {
            $candlePath = $candle.Source
            $lightPath = $light.Source
          }

          python Resources/Packages/windows.py `
            --version ${{ env.LIBVERSION }} `
            --arch x64 `
            --output OpenScofo-${{ env.LIBVERSION }}-Win64.msi `
            --candle "$candlePath" `
            --light "$lightPath"

      # -----------------------
      # Upload artifacts
      # -----------------------
      - name: Upload PureData Object
        uses: actions/upload-artifact@v6
        with:
          name: PureData-${{env.LIBNAME}}-${{env.LIBVERSION}}-pd${{matrix.precision}}-${{
            runner.os }}
          path: | 
            ${{env.LIBNAME}}
            Tests/assets/canticos.wav
            Tests/assets/canticos.txt

      - name: Upload Max Object
        uses: actions/upload-artifact@v6
        if: runner.os != 'Linux'
        with:
          name: Max-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: |
            max
            Tests/assets/canticos.wav
            Tests/assets/canticos.txt
      - name: Upload Python Object
        uses: actions/upload-artifact@v6
        with:
          name: Python-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: dist/*.whl

      - name: Upload Installer
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Installer-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: |
            *.exe
            *.dmg
            *.msi
            *.pkg
            build/*.exe
            build/*.dmg
            build/*.msi
            build/*.pkg
      - name: Upload Vamp Plugin
        uses: actions/upload-artifact@v6
        with:
          name: Vamp-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: |
            build/Sources/Wrappers/Vamp/*.so
            build/Sources/Wrappers/Vamp/*.dylib
            build/Sources/Wrappers/Vamp/*.dll
            Tests/assets/canticos.wav
            Tests/assets/canticos.txt

      - name: Prepare SuperCollider Final Folder
        shell: bash
        run: |
          mkdir -p SuperCollider

          # binaries
          cp build/Sources/Wrappers/SuperCollider/*.so SuperCollider/ 2>/dev/null || true
          cp build/Sources/Wrappers/SuperCollider/*.dylib SuperCollider/ 2>/dev/null || true
          cp build/Sources/Wrappers/SuperCollider/*.dll SuperCollider/ 2>/dev/null || true
          cp build/Sources/Wrappers/SuperCollider/*.scx SuperCollider/ 2>/dev/null || true

          # sc files
          cp Sources/Wrappers/SuperCollider/*.sc SuperCollider/ 2>/dev/null || true

          # examples
          mkdir -p SuperCollider/examples
          cp Sources/Wrappers/SuperCollider/examples/*.scd SuperCollider/examples/ 2>/dev/null || true

          # assets
          mkdir -p SuperCollider/assets
          cp Tests/assets/* SuperCollider/assets/

      - name: Upload Emscripten Build
        if: runner.os == 'Linux'
        run: |
          mkdir -p Emscripten
          mkdir -p Emscripten
          cp build-wasm/Sources/Wrappers/Wasm/OpenScofo.wasm Emscripten/ 2>/dev/null || true
          cp build-wasm/Sources/Wrappers/Wasm/OpenScofo.js Emscripten/ 2>/dev/null || true
          cp Sources/Wrappers/Wasm/index.html Emscripten/ 2>/dev/null || true
      - name: Upload SuperCollider
        uses: actions/upload-artifact@v6
        with:
          name: SuperCollider-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: SuperCollider

      - name: Upload Emscripten
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: Emscripten-${{env.LIBNAME}}-${{env.LIBVERSION}}-WASM
          path: Emscripten

      - name: Upload CSound
        uses: actions/upload-artifact@v6
        with:
          name: CSound-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: |-
            build/Sources/Wrappers/CSound/*.so
            build/Sources/Wrappers/CSound/*.dylib
            build/Sources/Wrappers/CSound/*.dll
            Tests/assets/canticos.wav
            Tests/assets/canticos.txt

      - name: Build Source
        uses: actions/upload-artifact@v6
        with:
          name: Build-${{env.LIBNAME}}-${{env.LIBVERSION}}-${{ runner.os }}
          path: |-
            build/Sources/Wrappers/

      - name: Publish Pip
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --skip-existing dist/*.whl

  publish-release:
    if: ${{ github.event.inputs.publish_release == 'true' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create per-artifact zip archives
        run: |
          set -euo pipefail
          mkdir -p release_assets
          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            name="$(basename "$artifact_dir")"
            (cd "$artifact_dir" && zip -r "../../release_assets/${name}.zip" .)
          done
          ls -1 release_assets
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.LIBVERSION }}-alpha
          name: ${{ env.LIBNAME }} v${{ env.LIBVERSION }}-alpha
          target_commitish: ${{ github.sha }}
          files: |
            release_assets/*.zip
          draft: true
          prerelease: false
