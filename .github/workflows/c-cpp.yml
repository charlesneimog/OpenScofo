---
name: Compile Binaries
on:
    # push:
    #   branches: [main]
    workflow_dispatch:
        inputs:
            publish_release:
                description: Publish Release
                required: false
                default: false
                type: boolean
permissions:
    contents: write
jobs:
    build:
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            SCCACHE_CACHE_SIZE: 2G
            SCCACHE_GHA_VERSION: ${{ matrix.os }}-v4
            SCCACHE_CACHE_MULTIARCH: "1"
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                # os: [macos-latest, windows-latest]
                precision: [32]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  submodules: recursive
                  fetch-depth: 1
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.9
            - name: Setup Emscripten
              if: runner.os == 'Linux'
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: latest

            # -----------------------
            # Linux dependencies
            # -----------------------
            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt update
                  sudo apt install puredata -y
                  sudo apt install libboost-all-dev libgtest-dev -y
                  npm install -g tree-sitter-cli
                  pip install build scikit-build-core cibuildwheel twine nanobind

            # -----------------------
            # macOS dependencies
            # -----------------------
            - name: Install dependencies (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install pd nanobind googletest tree-sitter boost
                  npm install -g tree-sitter-cli
                  pip install build scikit-build-core cibuildwheel twine
            # -----------------------
            # Windows dependencies
            # -----------------------
            - name: Install dependencies (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  npm install -g tree-sitter-cli
                  winget install -e --id LLVM.LLVM --accept-source-agreements --accept-package-agreements
                  winget install -e --id MillerPuckette.PureData --accept-source-agreements
                  choco install wixtoolset --no-progress -y
                  $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.11\bin'
                  if (Test-Path $wixBin) {
                    "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  }
                  python -m pip install --upgrade pip
                  python -m pip install build scikit-build-core cibuildwheel twine nanobind

            # -----------------------
            - name: Build (MacOS)
              if: runner.os == 'macOS'
              env:
                  ARCHFLAGS: "-arch x86_64 -arch arm64"
                  MACOSX_DEPLOYMENT_TARGET: 10.15
              run: |
                  python -m build --wheel \
                    -Cbuild-dir=build \
                    -Ccmake.define.PD_FLOATSIZE=${{ matrix.precision }} \
                    -Ccmake.define.CMAKE_BUILD_TYPE=Release \
                    -Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
                    -Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
                    -Ccmake.define.CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
                    -Ccmake.define.OPENSCOFO_BUILD_TESTS=OFF \
                    -Ccmake.define.CMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
                    -Ccmake.define.PD_LIB_DIR="${{ github.workspace }}/${{ env.LIBNAME }}" \
                    -Ccmake.define.CMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
                    -Ccmake.define.OPENSCOFO_BUILD_ALL=ON \
                    -Ccmake.args="-G Ninja"

            # -----------------------
            - name: Build (Linux)
              if: runner.os == 'Linux'
              run: |
                  python -m build --wheel \
                    -Cbuild-dir=build \
                    -Ccmake.define.PD_FLOATSIZE=${{ matrix.precision }} \
                    -Ccmake.define.CMAKE_BUILD_TYPE=Release \
                    -Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache \
                    -Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache \
                    -Ccmake.define.CMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
                    -Ccmake.define.OPENSCOFO_BUILD_TESTS=OFF \
                    -Ccmake.define.PD_LIB_DIR="${{ github.workspace }}/${{ env.LIBNAME }}" \
                    -Ccmake.define.CMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
                    -Ccmake.define.OPENSCOFO_BUILD_ALL=ON \
                    -Ccmake.args="-G Ninja"

            # -----------------------
            # Configure (Windows)
            # -----------------------
            - name: Build (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $treeSitterBin = (Get-Command tree-sitter.cmd).Source
                  $buildArgs = @(
                    "-Cbuild-dir=build"
                    "-Ccmake.define.PD_FLOATSIZE=${{ matrix.precision }}"
                    "-Ccmake.define.CMAKE_BUILD_TYPE=Release"
                    "-Ccmake.define.TREE_SITTER_EXECUTABLE=$treeSitterBin"
                    "-Ccmake.define.CMAKE_C_COMPILER=clang"
                    "-Ccmake.define.CMAKE_CXX_COMPILER=clang++"
                    "-Ccmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache"
                    "-Ccmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache"
                    "-Ccmake.define.OPENSCOFO_BUILD_TESTS=OFF"
                    "-Ccmake.define.PD_LIB_DIR=${{ github.workspace }}/${{ env.LIBNAME }}"
                    "-Ccmake.define.OPENSCOFO_BUILD_ALL=ON"
                    "-Ccmake.args=-G Ninja"
                  )
                  python -m build --wheel @buildArgs
            - name: Build Emscripten
              if: runner.os == 'Linux'
              env:
                  SCCACHE_GHA_VERSION: ${{ matrix.os }}-pd${{ matrix.precision }}-wasm
              run: |
                  source $EMSDK/emsdk_env.sh
                  emcmake cmake . -B build-wasm \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER_LAUNCHER=sccache \
                    -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
                    -DOPENSCOFO_BUILD_TESTS=OFF \
                    -DOPENSCOFO_BUILD_ALL=ON
                  cmake --build build-wasm
            - name: Repair Linux wheels
              if: runner.os == 'Linux'
              continue-on-error: true
              run: |
                  python -m pip install auditwheel
                  auditwheel repair dist/*.whl -w dist/
                  rm dist/*-linux_*.whl

            - name: Extract version from wheel
              id: wheel_version
              shell: bash
              run: |
                  set -euo pipefail

                  wheel="$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n 1)"

                  if [[ -z "$wheel" ]]; then
                    echo "ERROR: No wheel found in dist/"
                    exit 1
                  fi

                  wheel_name="$(basename "$wheel")"
                  wheel_stem="${wheel_name%.whl}"
                  dist_name="${wheel_stem%%-*}"
                  version="${wheel_stem#*-}"
                  version="${version%%-*}"

                  echo "Extracted WHEEL_NAME=$dist_name and WHEEL_VERSION=$version from $wheel_name"
                  echo "WHEEL_NAME=$dist_name" >> "$GITHUB_ENV"
                  echo "WHEEL_VERSION=$version" >> "$GITHUB_ENV"
                  echo "name=$dist_name" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Generate macOS Component Installer
              if: runner.os == 'macOS'
              run: |
                  python Resources/Packages/macos.py --version "$WHEEL_VERSION"

            - name: Generate Linux Component Installer
              if: runner.os == 'Linux'
              run: |
                  python Resources/Packages/linux.py --version "$WHEEL_VERSION"

            - name: Generate Windows Component Installer
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  cmake --install build --prefix install
                  $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue)
                  $light = (Get-Command light.exe -ErrorAction SilentlyContinue)

                  if (-not $candle -or -not $light) {
                    $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.11\bin'
                    $candlePath = Join-Path $wixBin 'candle.exe'
                    $lightPath = Join-Path $wixBin 'light.exe'
                  } else {
                    $candlePath = $candle.Source
                    $lightPath = $light.Source
                  }

                  python Resources/Packages/windows.py `
                    --version $env:WHEEL_VERSION `
                    --arch x64 `
                    --output "OpenScofo-$($env:WHEEL_VERSION)-Win64.msi" `
                    --candle "$candlePath" `
                    --light "$lightPath"

            - name: Stage Max package payload (macOS)
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  set -euo pipefail

                  package_root="max-package/OpenScofo"
                  mkdir -p "$package_root/docs" "$package_root/help" "$package_root/externals"

                  cp Sources/Wrappers/Max/package/License.md "$package_root/"
                  cp Sources/Wrappers/Max/package/Readme.md "$package_root/"
                  cp Sources/Wrappers/Max/package/icon.png "$package_root/"
                  cp Sources/Wrappers/Max/package/package-info.json "$package_root/"
                  cp Sources/Wrappers/Max/docs/openscofo~.maxref.xml "$package_root/docs/"
                  cp Sources/Wrappers/Max/openscofo~.maxhelp "$package_root/help/"
                  cp Tests/miniaturas/Extras/ai-flute-model.onnx "$package_root/help/"
                  cp Tests/assets/canticos.txt "$package_root/help/"
                  cp Tests/assets/canticos.wav "$package_root/help/"
                  cp Tests/miniaturas/Audios/miniatura1.mp3 "$package_root/help/"
                  cp Tests/miniaturas/Extras/miniatura1.scofo "$package_root/help/"
                  cp -R max/openscofo~.mxo "$package_root/externals/"

                  test -f "$package_root/docs/openscofo~.maxref.xml"
                  test -f "$package_root/help/openscofo~.maxhelp"
                  test -f "$package_root/help/canticos.wav"
                  test -f "$package_root/help/ai-flute-model.onnx"
                  test -f "$package_root/externals/openscofo~.mxo/Contents/MacOS/openscofo~"

            - name: Stage Max package payload (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  $packageRoot = 'max-package/OpenScofo'
                  New-Item -ItemType Directory -Force "$packageRoot/externals" | Out-Null
                  Copy-Item 'max/openscofo~.mxe64' "$packageRoot/externals/openscofo~.mxe64"

                  if (-not (Test-Path "$packageRoot/externals/openscofo~.mxe64")) {
                    throw 'Max Windows external was not staged.'
                  }

            # -----------------------
            # Upload artifacts
            # -----------------------
            - name: Upload Installer
              uses: actions/upload-artifact@v6
              with:
                  name: Installer-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: |
                      *.pkg
                      *.msi
                      *.sh

            - name: Upload Python Wheel
              uses: actions/upload-artifact@v6
              with:
                  name: Python-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: dist/*.whl

            - name: Upload Max Package Payload
              if: runner.os == 'macOS' || runner.os == 'Windows'
              uses: actions/upload-artifact@v6
              with:
                  name: MaxPackagePart-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-${{ runner.os }}
                  path: max-package
                  if-no-files-found: error

            - name: Upload Emscripten
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v6
              with:
                  name: Emscripten-${{steps.wheel_version.outputs.name}}-${{steps.wheel_version.outputs.version}}-Linux
                  path: |
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo.js
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo.wasm
                      build-wasm/Sources/Wrappers/Wasm/OpenScofo*.worker.js
                  if-no-files-found: error

            - name: Publish Pip
              if: ${{ github.event.inputs.publish_release == 'true' }}
              continue-on-error: true
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: |
                  python -m twine upload --skip-existing dist/*.whl

    publish-release:
        if: ${{ github.event.inputs.publish_release == 'true' }}
        needs: [build]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Extract release version from artifacts
              id: release_metadata
              shell: bash
              run: |
                  set -euo pipefail

                  artifact_name="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'Installer-*' -printf '%f\n' | sort | head -n 1)"

                  if [[ -z "$artifact_name" ]]; then
                    echo "ERROR: No Installer artifact found"
                    exit 1
                  fi

                  metadata="${artifact_name#Installer-}"
                  metadata="${metadata%-Linux}"
                  metadata="${metadata%-macOS}"
                  metadata="${metadata%-Windows}"
                  release_version="${metadata##*-}"

                  echo "Extracted RELEASE_VERSION=$release_version from $artifact_name"
                  echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
                  echo "version=$release_version" >> "$GITHUB_OUTPUT"

            - name: Create per-artifact zip archives
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p release_assets

                  for artifact_dir in artifacts/*; do
                    [ -d "$artifact_dir" ] || continue
                    name="$(basename "$artifact_dir")"
                    if [[ "$name" == MaxPackagePart-* ]]; then
                      continue
                    fi
                    (cd "$artifact_dir" && zip -r "../../release_assets/${name}.zip" .)
                  done

                  ls -1 release_assets

            - name: Create Max-only package zip
              shell: bash
              run: |
                  set -euo pipefail

                  mac_part="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'MaxPackagePart-*-macOS' | sort | head -n 1)"
                  win_part="$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'MaxPackagePart-*-Windows' | sort | head -n 1)"

                  if [[ -z "$mac_part" || -z "$win_part" ]]; then
                    echo "ERROR: Missing Max package payload artifacts."
                    echo "mac_part=$mac_part"
                    echo "win_part=$win_part"
                    exit 1
                  fi

                  mkdir -p max_release
                  cp -R "$mac_part/OpenScofo" max_release/
                  mkdir -p max_release/OpenScofo/externals
                  cp "$win_part/OpenScofo/externals/openscofo~.mxe64" max_release/OpenScofo/externals/

                  test -f max_release/OpenScofo/docs/openscofo~.maxref.xml
                  test -f max_release/OpenScofo/help/openscofo~.maxhelp
                  test -f max_release/OpenScofo/help/canticos.wav
                  test -f max_release/OpenScofo/help/ai-flute-model.onnx
                  test -f max_release/OpenScofo/externals/openscofo~.mxo/Contents/MacOS/openscofo~
                  test -f max_release/OpenScofo/externals/openscofo~.mxe64

                  (cd max_release && zip -r "../release_assets/OpenScofo-Max-${RELEASE_VERSION}.zip" OpenScofo)

                  ls -lh "release_assets/OpenScofo-Max-${RELEASE_VERSION}.zip"

            - name: Generate release notes
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  current_tag="v${RELEASE_VERSION}"
                  previous_tag=""
                  previous_target=""

                  release_info="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                    --jq "(map(select(.tag_name != \"${current_tag}\")) | .[0]) // {} | [.tag_name // \"\", .target_commitish // \"\"] | @tsv" \
                    || true)"

                  if [[ -n "$release_info" && "$release_info" != "null" ]]; then
                    previous_tag="$(printf '%s' "$release_info" | cut -f1)"
                    previous_target="$(printf '%s' "$release_info" | cut -f2)"
                  fi

                  git fetch --tags --force

                  previous_ref=""
                  if [[ -n "$previous_tag" ]] && git rev-parse --verify --quiet "${previous_tag}^{commit}" >/dev/null; then
                    previous_ref="$previous_tag"
                  elif [[ -n "$previous_target" ]] && git rev-parse --verify --quiet "${previous_target}^{commit}" >/dev/null; then
                    previous_ref="$previous_target"
                  else
                    previous_ref="$(git describe --tags --abbrev=0 --exclude "$current_tag" 2>/dev/null || true)"
                  fi

                  {
                    echo "## Changes"
                    echo
                    if [[ -n "$previous_ref" ]]; then
                      echo "Commits from \`${previous_tag:-$previous_ref}\` to \`${current_tag}\`."
                      range="${previous_ref}..${GITHUB_SHA}"
                    else
                      echo "Commits included in \`${current_tag}\`."
                      range="${GITHUB_SHA}"
                    fi
                    echo

                    if [[ "$(git rev-list --count "$range")" == "0" ]]; then
                      echo "No commits found since the previous release."
                    else
                      git log --reverse \
                        --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s%n%w(0,2,2)%b%n" \
                        "$range"
                    fi
                  } > release_notes.md

                  cat release_notes.md

            - name: Create / Update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.release_metadata.outputs.version }}
                  name: v${{ steps.release_metadata.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  body_path: release_notes.md
                  files: |
                      release_assets/*.zip
                  draft: true
                  prerelease: false
