<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>OpenScofo Editor Workspace</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />

        <!-- ─────────────── Zip ─────────────── -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
            integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!-- <script type="module" src="tree-sitter/web-tree-sitter.js"></script> -->

        <!-- ─────────────── Editor ─────────────── -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"
            integrity="sha512-8RnEqURPUc5aqFEN04aQEiPlSAdE0jlFS/9iGgUyNtwFnSKCXhmB6ZTNl7LnDtDWKabJIASzXrzD0K+LYexU9g=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css"
            integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <link href="./output.css" rel="stylesheet" />
        <link href="./styles.css" rel="stylesheet" />
        <style>
            /* Custom scrollbar for code editor feel */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: var(--bg);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--surface-border);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--comment);
            }
            .code-line-numbers {
                counter-reset: line;
            }
            .code-line::before {
                counter-increment: line;
                content: counter(line);
                display: inline-block;
                width: 2rem;
                margin-right: 1rem;
                color: var(--line-number);
                text-align: right;
                user-select: none;
            }
        </style>
    </head>
    <body
        class="bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary font-display h-dvh flex flex-col overflow-hidden"
    >
        <!-- Header -->
        <header
            class="flex min-h-16 shrink-0 flex-wrap gap-3 py-2 items-center justify-between border-b border-solid border-hover-light dark:border-text-light-third bg-background-light dark:bg-background-dark px-6 z-20"
        >
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="size-12 flex-shrink-0">
                        <a href="https://charlesneimog.github.io/OpenScofo/">
                            <img
                                src="https://raw.githubusercontent.com/charlesneimog/OpenScofo/refs/heads/main/Documentation/assets/logo.svg"
                                class="h-12 w-12 object-contain"
                                alt="OpenScofo"
                            />
                        </a>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h2
                            class="font-bold leading-tight tracking-[-0.015em] text-text-light-primary dark:text-text-dark-primary"
                        >
                            OpenScofo Score Editor
                        </h2>
                    </div>
                </div>
            </div>
            <div role="toolbar" aria-label="Score actions" class="score-toolbar flex flex-wrap gap-2">
                <button
                    class="flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-hover-light dark:bg-hover-dark px-3 py-1.5 text-xs font-bold text-text-light-primary dark:text-text-dark-primary hover:bg-accent hover:text-white transition-colors"
                    id="upload-score"
                >
                    <input type="file" id="scoreXmlInput" accept=".xml, .musicxml, .mxl" style="display: none" />
                    <span class="material-symbols-outlined text-base">music_note</span>
                    Import MusicXML
                </button>
                <button
                    class="flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-hover-light dark:bg-hover-dark px-3 py-1.5 text-xs font-bold text-text-light-primary dark:text-text-dark-primary hover:bg-accent hover:text-white transition-colors"
                    id="load-score"
                >
                    <input type="file" id="scoreTxtInput" accept=".txt, .scofo" style="display: none" />
                    <span class="material-symbols-outlined text-base">upload_file</span>
                    Load Score
                </button>
                <button
                    class="flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-hover-light dark:bg-hover-dark px-3 py-1.5 text-xs font-bold text-text-light-primary dark:text-text-dark-primary hover:bg-accent hover:text-white transition-colors"
                    id="format-score"
                    type="button"
                >
                    <span class="material-symbols-outlined text-base">format_align_left</span>
                    Format Score
                </button>
                <button
                    class="flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-accent px-3 py-1.5 text-xs font-bold text-white hover:brightness-110 transition-colors"
                    id="download-score"
                >
                    <span class="material-symbols-outlined text-base">download</span>
                    Download Score
                </button>
            </div>
        </header>
        <!-- Main Workspace -->
        <main class="flex min-h-0 flex-1 overflow-hidden">
            <!-- Score Editor and Error Console -->
            <section class="flex min-h-0 min-w-0 w-full flex-col bg-background-light dark:bg-background-dark">
                <!-- Editor Area -->
                <div id="code-container" class="score-editor">
                    <textarea id="code-input"> </textarea>
                </div>

                <!-- Console Area -->
                <div
                    class="flex h-48 max-h-[30dvh] shrink-0 flex-col border-t border-hover-light dark:border-text-light-third bg-hover-light dark:bg-hover-dark"
                >
                    <div
                        class="flex h-8 shrink-0 items-center justify-between border-b border-hover-light dark:border-text-light-third bg-background-light dark:bg-background-dark px-4"
                    >
                        <span
                            class="text-xs font-semibold text-text-light-secondary dark:text-text-dark-secondary uppercase tracking-wider"
                            >Score Errors</span
                        >
                        <div class="flex flex-wrap gap-2">
                            <button
                                id="clear-console"
                                type="button"
                                class="text-xs text-text-light-secondary dark:text-text-dark-secondary hover:text-accent"
                            >
                                Clear
                            </button>
                        </div>
                    </div>
                    <div
                        id="editor-console"
                        aria-label="Score errors"
                        class="min-h-0 flex-1 overflow-auto p-3 font-mono text-xs"
                    ></div>
                </div>
            </section>
        </main>
    </body>
    <script type="module">
        import { app } from "./app.js";
    </script>
</html>
