<!doctype html>
<html lang="en">
    <head>
        <title>Pd4Web</title>
        <meta charset="UTF-8" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#000000" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />

        <script src="./pd4web.threads.js"></script>
        <script src="./pd4web.js"></script>

        <style>
            :root {
                --bg: #f4f6f9;
                --fg: rgba(20, 25, 31, 0.92);
                --panel: rgba(255, 255, 255, 0.75);
                --shadow: rgba(15, 23, 42, 0.12) 0px 2px 4px, rgba(15, 23, 42, 0.22) 0px 10px 24px;
                --accent-shadow: rgba(100, 30, 37, 0.12) 0px 2px 4px 0px, rgba(100, 30, 37, 0.32) 0px 2px 16px 0px;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #171b20;
                    --fg: rgba(255, 255, 255, 0.9);
                    --panel: rgba(36, 40, 46, 0.7);
                    --shadow: rgba(0, 0, 0, 0.2) 0px 2px 4px, rgba(0, 0, 0, 0.45) 0px 12px 28px;
                }
            }

            body {
                margin: 0;
                touch-action: pan-x pan-y;
                color: var(--fg);
                background-color: var(--bg);
            }

            span {
                color: var(--fg);
            }

            /* Main Layout Container */
            .app-container {
                display: flex;
                height: 100vh; /* Constrain the entire app to the viewport height */
                overflow: hidden; /* Prevent the whole body from scrolling */
            }

            /* Sidebar/Canvas Section */
            .controls-container {
                padding: 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Score Viewport Container */
            .score-viewport {
                width: 80%;
                margin: 2%;
                /* Critical: Constrain height to viewport minus margins to force internal scrolling */
                max-height: 96vh;
                overflow-x: auto;
                overflow-y: auto; /* Changed from hidden to auto to allow vertical scrolling */
                border-radius: 0.65rem;
                background-color: #ffffff;
                scroll-behavior: smooth;
            }

            /* Ensure layout adapts on smaller screens */
            @media (max-width: 768px) {
                .app-container {
                    flex-direction: column;
                }
                .score-viewport {
                    width: 96%;
                    max-height: 50vh;
                }
            }

            .pd4web-sound-switch {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                height: 25px;
                margin: 0 auto;
                transform: none;
            }

            .pd4web-patch-canvas:focus {
                box-shadow:
                    rgba(100, 30, 37, 0.12) 0px 2px 4px 0px,
                    rgba(100, 30, 37, 0.32) 0px 2px 16px 0px;
                outline: none;
                border-radius: 0.65rem;
            }
        </style>
    </head>
    <body>
        <div id="wasm-loader">
            <span id="status">Loading...</span>
            <progress id="progress" value="0" max="100"></progress>
        </div>

        <div class="app-container">
            <div class="controls-container">
                <span class="pd4web-sound-switch" id="Pd4WebAudioSwitch"></span>
                <canvas tabindex="0" class="pd4web-patch-canvas" id="Pd4WebCanvas"></canvas>
            </div>

            <div class="score-viewport" id="score-container">
                <div id="score"></div>
            </div>
        </div>

        <script>
            const getEId = (id) => document.getElementById(id);
            const ui = { status: getEId("status"), progress: getEId("progress"), loader: getEId("wasm-loader") };
            var Pd4Web = null;

            // 1. Fetch and inject the SVG
            fetch("score.svg")
                .then((r) => r.text())
                .then((svgText) => {
                    const container = document.getElementById("score");
                    container.innerHTML = svgText;
                    const svg = container.querySelector("svg");
                    if (svg) {
                        svg.style.width = "100%";
                        svg.style.height = "auto";
                        svg.style.display = "block";
                    }
                    container.style.padding = "20px";
                })
                .catch((err) => console.error("Failed to load SVG:", err));

            // 2. Fetch WASM payload
            const fetchWasm = async (url) => {
                const res = await fetch(url);
                if (!res.ok || !res.body) {
                    throw new Error(`Failed to load ${url}, status ${res.status}`);
                }
                const contentLength = Number(res.headers.get("Content-Length")) || 0;
                const reader = res.body.getReader();
                let received = 0;
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    received += value.length;

                    if (contentLength) {
                        const pct = Math.floor((received / contentLength) * 100);
                        ui.progress.value = pct;
                        ui.status.textContent = `Downloading WASM... ${pct}%`;
                    } else {
                        ui.status.textContent = `Downloading WASM... ${Math.round(received / 1024)} KB`;
                    }
                }

                const buffer = new Uint8Array(received);
                let offset = 0;
                for (const chunk of chunks) {
                    buffer.set(chunk, offset);
                    offset += chunk.length;
                }
                return buffer.buffer;
            };

            // 3. Initialize Pd4Web and handle Auto-Scrolling
            (async () => {
                try {
                    const wasmBinary = await fetchWasm("./pd4web.wasm");
                    Pd4WebModule({ wasmBinary }).then(async (module) => {
                        Pd4Web = new module.Pd4Web();
                        Pd4Web.openPatch("index.pd", {
                            canvasId: "Pd4WebCanvas",
                            soundToggleId: "Pd4WebAudioSwitch",
                        });
                        ui.loader.style.display = "none";

                        if (Pd4Web) {
                            Pd4Web.onFloatReceived("scoreevent", (r, f) => {
                                // Event 0: Reset the score
                                if (f === 0) {
                                    document.querySelectorAll("[openscofo-event-number]").forEach((note) => {
                                        note.setAttribute("fill", "black");
                                    });
                                    return;
                                }

                                // Active Event: Highlight and Scroll
                                const notes = document.querySelectorAll(`[openscofo-event-number="${f}"]`);

                                if (notes.length > 0) {
                                    // Highlight all parts of the current event
                                    for (const note of notes) {
                                        note.setAttribute("fill", "red");
                                    }

                                    // Native DOM Auto-Scrolling
                                    // This forces the browser to calculate the exact offset and center the element
                                    notes[0].scrollIntoView({
                                        behavior: "smooth", // Smooth animation
                                        block: "center", // Center vertically in the container
                                        inline: "center", // Center horizontally if needed
                                    });
                                }
                            });
                        }
                    });
                } catch (error) {
                    ui.status.textContent = "Failed to load WASM.";
                    console.error(error);
                }
            })();
        </script>
    </body>
</html>
