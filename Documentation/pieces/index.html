<!DOCTYPE html><html lang="en"><head>
        <title>.</title>
        <meta charset="UTF-8">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#000000">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="apple-touch-icon" href="icon-192.png">
        <meta name="mobile-web-app-capable" content="yes">

        <script src="./pd4web.threads.js"></script>
        <script src="./pd4web.js"></script>

        <style>
            :root {
                --bg: #f4f6f9;
                --fg: rgba(20, 25, 31, 0.92);
                --panel: rgba(255, 255, 255, 0.75);
                --shadow: rgba(15, 23, 42, 0.12) 0px 2px 4px, rgba(15, 23, 42, 0.22) 0px 10px 24px;
                --accent-shadow: rgba(100, 30, 37, 0.12) 0px 2px 4px 0px, rgba(100, 30, 37, 0.32) 0px 2px 16px 0px;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #171b20;
                    --fg: rgba(255, 255, 255, 0.9);
                    --panel: rgba(36, 40, 46, 0.7);
                    --shadow: rgba(0, 0, 0, 0.2) 0px 2px 4px, rgba(0, 0, 0, 0.45) 0px 12px 28px;
                }
            }

            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                touch-action: pan-x pan-y;
                color: var(--fg);
                background-color: var(--bg);
            }

            span {
                color: var(--fg);
            }

            /* Main Layout Container */
            .app-container {
                display: flex;
                height: 100vh; /* Constrain the entire app to the viewport height */
                overflow: hidden; /* Prevent the whole body from scrolling */
            }

            .score-buttons {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            .score-buttons button {
                padding: 0.5rem 1rem;
                border: 1px solid currentColor;
                border-radius: 0.35rem;
                color: var(--fg);
                background: transparent;
                font: inherit;
                cursor: pointer;
            }

            .score-buttons button:hover:not(:disabled) {
                background: var(--panel);
            }

            .score-buttons button[aria-pressed="true"] {
                color: #fff;
                background: #641e25;
                border-color: #641e25;
            }

            .score-buttons button:focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 3px;
            }

            .score-buttons button:disabled {
                opacity: 0.5;
                cursor: wait;
            }

            #status:empty {
                display: none;
            }

            #score {
                padding: 20px;
            }

            #score svg {
                width: 100%;
                height: auto;
                display: block;
            }

            /* Sidebar/Canvas Section */
            .controls-container {
                padding: 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Score Viewport Container */
            .score-viewport {
                width: 80%;
                margin: 2%;
                /* Critical: Constrain height to viewport minus margins to force internal scrolling */
                max-height: 96vh;
                overflow-x: auto;
                overflow-y: auto; /* Changed from hidden to auto to allow vertical scrolling */
                border-radius: 0.65rem;
                background-color: #ffffff;
                scroll-behavior: smooth;
            }

            /* Ensure layout adapts on smaller screens */
            @media (max-width: 768px) {
                .app-container {
                    flex-direction: column;
                }
                .score-viewport {
                    width: 96%;
                    max-height: 50vh;
                }
            }

            .pd4web-sound-switch {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                height: 25px;
                margin: 0 auto;
                transform: none;
            }

            .pd4web-patch-canvas:focus {
                box-shadow:
                    rgba(100, 30, 37, 0.12) 0px 2px 4px 0px,
                    rgba(100, 30, 37, 0.32) 0px 2px 16px 0px;
                outline: none;
                border-radius: 0.65rem;
            }
        </style>
    </head>
    <body>
        <div class="app-container">
            <div class="controls-container">
                <p id="status" role="status"></p>
                <span class="pd4web-sound-switch" id="Pd4WebAudioSwitch"></span>
                <hr>
                <canvas tabindex="0" class="pd4web-patch-canvas" id="Pd4WebCanvas"></canvas>
            </div>

            <div class="score-viewport" id="score-container">
                <div id="score"></div>
            </div>
        </div>

        <script>
            const getEId = (id) => document.getElementById(id);
            const ui = { status: getEId("status"), score: getEId("score"), viewport: getEId("score-container") };
            const scoreButtons = document.querySelectorAll("[data-score]");
            var Pd4Web = null;
            let scoreRequest = 0;

            async function loadScore(piece, playAudio = false) {
                const request = ++scoreRequest;
                try {
                    const response = await fetch(`score${piece}.svg`);
                    if (!response.ok) throw new Error(`Failed to load score ${piece}: ${response.status}`);
                    const svgText = await response.text();
                    // A slower response must not replace a more recent selection.
                    if (request !== scoreRequest) return;
                    ui.score.innerHTML = svgText;
                    ui.viewport.scrollTo({ top: 0, left: 0, behavior: "instant" });
                    scoreButtons.forEach((button) => {
                        button.setAttribute("aria-pressed", String(Number(button.dataset.score) === piece));
                    });
                    if (playAudio && Pd4Web) {
                        Pd4Web.sendFloat("score", piece);
                        Pd4Web.sendFloat("audio", piece);
                    }
                    ui.status.textContent = "";
                } catch (error) {
                    if (request !== scoreRequest) return;
                    ui.status.textContent = `Could not load Score ${piece}. Please try again.`;
                    console.error(error);
                }
            }

            scoreButtons.forEach((button) => {
                button.addEventListener("click", () => loadScore(Number(button.dataset.score), true));
            });
            loadScore(1);

            // 2. Fetch WASM payload
            const fetchWasm = async (url) => {
                const res = await fetch(url);
                if (!res.ok || !res.body) {
                    throw new Error(`Failed to load ${url}, status ${res.status}`);
                }
                const contentLength = Number(res.headers.get("Content-Length")) || 0;
                const reader = res.body.getReader();
                let received = 0;
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    received += value.length;
                }

                const buffer = new Uint8Array(received);
                let offset = 0;
                for (const chunk of chunks) {
                    buffer.set(chunk, offset);
                    offset += chunk.length;
                }
                return buffer.buffer;
            };

            // 3. Initialize Pd4Web and handle Auto-Scrolling
            (async () => {
                try {
                    const wasmBinary = await fetchWasm("./pd4web.wasm");
                    const module = await Pd4WebModule({ wasmBinary });
                    Pd4Web = new module.Pd4Web();
                    await Pd4Web.openPatch("index.pd", {
                        canvasId: "Pd4WebCanvas",
                        soundToggleId: "Pd4WebAudioSwitch",
                        renderGui: true,
                    });

                    if (Pd4Web) {
                        let scoreRequest = 0;

                        Pd4Web.onFloatReceived("miniatura", async (r, f) => {
                            const piece = Number(f);
                            const request = ++scoreRequest;
                            try {
                                const response = await fetch(`score${piece}.svg`);
                                if (!response.ok) {
                                    throw new Error(`Failed to load score ${piece}: ${response.status}`);
                                }
                                const svgText = await response.text();

                                // A slower response must not replace a more recent selection.
                                if (request !== scoreRequest) return;
                                ui.score.innerHTML = svgText;
                                ui.viewport.scrollTo({
                                    top: 0,
                                    left: 0,
                                    behavior: "instant",
                                });
                                scoreButtons.forEach((button) => {
                                    button.setAttribute("aria-pressed", String(Number(button.dataset.score) === piece));
                                });
                                ui.status.textContent = "";
                            } catch (error) {
                                console.error(error);
                                ui.status.textContent = `Failed to load score ${piece}`;
                            }
                        });

                        Pd4Web.onFloatReceived("scoreevent", (r, f) => {
                            // Event 0: Reset the score
                            if (f === 0) {
                                document.querySelectorAll("[openscofo-event-number]").forEach((note) => {
                                    note.setAttribute("fill", "black");
                                });
                                return;
                            }

                            // Active Event: Highlight and Scroll
                            const notes = document.querySelectorAll(`[openscofo-event-number="${f}"]`);

                            if (notes.length > 0) {
                                // Highlight all parts of the current event
                                for (const note of notes) {
                                    note.setAttribute("fill", "red");
                                }

                                // Native DOM Auto-Scrolling
                                // This forces the browser to calculate the exact offset and center the element
                                notes[0].scrollIntoView({
                                    behavior: "smooth", // Smooth animation
                                    block: "center", // Center vertically in the container
                                    inline: "center", // Center horizontally if needed
                                });
                            }
                        });
                    }
                    scoreButtons.forEach((button) => {
                        button.disabled = false;
                    });
                } catch (error) {
                    ui.status.textContent = "Failed to load WASM.";
                    console.error(error);
                }
            })();
        </script>
    

</body></html>
