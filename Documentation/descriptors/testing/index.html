<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OpenScofo Descriptors</title>

        <script src="OpenScofo.js"></script>
        <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
        <script src="https://unpkg.com/wavesurfer.js@7"></script>

        <style>
            :root {
                --bg-color: #f8f9fa;
                --text-color: #333;
                --border-color: #ccc;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-color: #121212;
                    --text-color: #e0e0e0;
                    --border-color: #444;
                }
            }

            body {
                font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                margin: 0;
                padding: 20px 40px;
                background-color: var(--bg-color);
                color: var(--text-color);
            }

            .header {
                display: flex;
                flex-direction: column;
                align-items: center; /* or flex-start if you want left-aligned */
                margin-bottom: 20px;
                gap: 10px;
            }

            h1 {
                font-weight: 300;
                font-size: 28px;
                margin: 0;
                text-align: center;
                flex-grow: 1;
            }

            .upload-btn {
                padding: 6px 16px;
                font-size: 14px;
                cursor: pointer;
                background-color: transparent;
                color: var(--text-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
            }

            .legend-group {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
                margin-bottom: 20px;
                padding-bottom: 15px;
                border-bottom: 1px solid var(--border-color);
            }

            .legend-group label {
                cursor: pointer;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                user-select: none;
                color: #888;
                transition: color 0.2s;
            }

            .legend-group input {
                display: none;
            }

            .chart-container {
                width: 100%;
                height: 50vh;
                position: relative;
            }
            #myChart {
                width: 100%;
                height: 100%;
            }

            #waveform {
                width: 100%;
                margin-top: 20px;
            }

            .controls {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 15px;
                margin-top: 20px;
            }
            .ctrl-btn {
                background: none;
                border: none;
                font-size: 20px;
                cursor: pointer;
                color: var(--text-color);
            }
            #timeDisplay {
                font-size: 14px;
                font-variant-numeric: tabular-nums;
            }
            #status {
                font-size: 12px;
                text-align: center;
                display: block;
                margin-top: 10px;
                color: #888;
            }
        </style>
    </head>

    <body>
        <div class="header">
            <h1>OpenScofo Descriptors</h1>
            <label class="upload-btn">
                Upload Audio File
                <input type="file" id="audioUpload" accept="audio/*" hidden />
            </label>
        </div>

        <div id="descriptor-selection" class="legend-group"></div>

        <div class="chart-container">
            <div id="myChart"></div>
        </div>

        <div id="waveform"></div>

        <div class="controls">
            <button class="ctrl-btn" id="playBtn" onclick="togglePlay()" disabled>▶</button>
            <button class="ctrl-btn" id="pauseBtn" onclick="wavesurfer.pause()" disabled>⏸</button>
            <button class="ctrl-btn" id="stopBtn" onclick="wavesurfer.stop()" disabled>■</button>
            <span id="timeDisplay">0:00.00</span>
        </div>

        <span id="status">Initializing WebGL Engine...</span>

        <script>
            let wasmModule = null;
            let oscofo = null;
            let wavesurfer = null;
            let analyzedData = [];
            let currentAudioTime = null;

            const descriptorList = [
                "onset",
                "silence",
                "ext",
                "max_amp",
                "loudness",
                "flux",
                "irregularity",
                "crest",
                "centroid",
                "spreadhz",
                "spread_variance",
                "flatness",
                "skewness",
                "slope",
                "kurtosis",
                "centroid_velocity",
                "hfr",
                "harmonicity",
                "zcr",
                "stddev",
                "pitch",
                "pitch_confidence",
                "db",
                "rms",
            ];

            const colors = [
                "#E6194B",
                "#3CB44B",
                "#FFE119",
                "#4363D8",
                "#F58231",
                "#911EB4",
                "#46F0F0",
                "#F032E6",
                "#BCF60C",
                "#008080",
                "#E6BEFF",
                "#9A6324",
            ];

            const defaultSelection = ["db", "flux", "flatness", "pitch"];
            const selectionContainer = document.getElementById("descriptor-selection");

            descriptorList.forEach((desc, i) => {
                const color = colors[i % colors.length];
                const label = document.createElement("label");
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.value = desc;
                checkbox.dataset.color = color;
                checkbox.checked = defaultSelection.includes(desc);

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(desc.replace("_", " ")));

                const updateColor = () => {
                    label.style.color = checkbox.checked ? color : "";
                };
                checkbox.addEventListener("change", () => {
                    updateColor();
                    updatePlot();
                });
                updateColor();
                selectionContainer.appendChild(label);
            });

            const isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;

            wavesurfer = WaveSurfer.create({
                container: "#waveform",
                waveColor: isDarkMode ? "#444" : "#ccc",
                progressColor: isDarkMode ? "#888" : "#555",
                height: 60,
                barWidth: 2,
            });

            wavesurfer.on("audioprocess", (t) => updateCursor(t));
            wavesurfer.on("seeking", () => updateCursor(wavesurfer.getCurrentTime()));

            function updatePlot() {
                if (!analyzedData.length) return;

                const chartDiv = document.getElementById("myChart");
                const selected = Array.from(document.querySelectorAll("#descriptor-selection input:checked"));
                const totalDuration = analyzedData[analyzedData.length - 1].time;

                // 1. DETERMINE VIEWPORT WIDTH
                // Default to full duration, otherwise use the user's current zoom width
                let viewWidth = totalDuration;
                if (chartDiv.layout && chartDiv.layout.xaxis && chartDiv.layout.xaxis.range) {
                    const range = chartDiv.layout.xaxis.range;
                    viewWidth = Math.abs(range[1] - range[0]);
                }

                // 2. CALCULATE "FOLLOW" RANGE
                // If zoomed in, center the currentAudioTime.
                // We also clamp the edges so we don't scroll past 0 or the end of the file.
                let targetRange = [0, totalDuration];
                if (viewWidth < totalDuration) {
                    let start = currentAudioTime - viewWidth / 2;
                    let end = currentAudioTime + viewWidth / 2;

                    // Clamp to start
                    if (start < 0) {
                        start = 0;
                        end = viewWidth;
                    }
                    // Clamp to end
                    if (end > totalDuration) {
                        end = totalDuration;
                        start = totalDuration - viewWidth;
                    }
                    targetRange = [start, end];
                }

                const ratio = currentAudioTime / totalDuration;
                const nearestIdx = Math.min(
                    analyzedData.length - 1,
                    Math.max(0, Math.floor(ratio * analyzedData.length)),
                );

                const traces = selected.map((cb) => ({
                    x: analyzedData.map((d) => d.time),
                    y: analyzedData.map((d) => d[cb.value]),
                    mode: "lines",
                    type: "scattergl",
                    name: cb.value,
                    line: { color: cb.dataset.color, width: 1.5, shape: "spline" },
                    hoverinfo: "skip",
                }));

                const annotations = selected.map((cb) => {
                    const val = analyzedData[nearestIdx][cb.value];
                    return {
                        x: currentAudioTime,
                        y: val,
                        xref: "x",
                        yref: "y",
                        text: `${cb.value.toUpperCase()}: ${val.toFixed(2)}`,
                        showarrow: false,
                        xanchor: "left",
                        font: { color: cb.dataset.color, size: 10, weight: "bold" },
                        bgcolor: isDarkMode ? "rgba(18,18,18,0.8)" : "rgba(255,255,255,0.8)",
                    };
                });

                const layout = {
                    margin: { l: 0, r: 0, t: 0, b: 0 },
                    paper_bgcolor: "transparent",
                    plot_bgcolor: "transparent",
                    showlegend: false,
                    xaxis: {
                        visible: false,
                        fixedrange: false,
                        range: targetRange, // FOLLOWS THE PLAYHEAD
                        spikemode: "across",
                        spikethickness: 1,
                        spikedash: "solid",
                        spikecolor: isDarkMode ? "#333" : "#ddd",
                    },
                    yaxis: {
                        visible: false,
                        fixedrange: true,
                    },
                    annotations: annotations,
                    shapes:
                        currentAudioTime !== null
                            ? [
                                  {
                                      type: "line",
                                      x0: currentAudioTime,
                                      x1: currentAudioTime,
                                      y0: 0,
                                      y1: 1,
                                      yref: "paper",
                                      line: { color: isDarkMode ? "#666" : "#aaa", width: 1 },
                                  },
                              ]
                            : [],
                };

                const config = {
                    responsive: true,
                    displayModeBar: false,
                    scrollZoom: true,
                    doubleClick: "reset",
                };

                Plotly.react("myChart", traces, layout, config);
            }

            function updateCursor(time) {
                currentAudioTime = time;
                const mins = Math.floor(time / 60);
                const secs = (time % 60).toFixed(2).padStart(5, "0");
                document.getElementById("timeDisplay").innerText = `${mins}:${secs}`;
                updatePlot();
            }

            async function analyzeAudio(arrayBuffer, type) {
                const status = document.getElementById("status");
                analyzedData = [];

                const blob = new Blob([arrayBuffer], { type });
                wavesurfer.load(URL.createObjectURL(blob));

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
                const channelData = audioBuffer.getChannelData(0);

                if (audioBuffer.sampleRate !== 44100)
                    oscofo = new wasmModule.OpenScofo(audioBuffer.sampleRate, 2048, 512);

                const windowSize = 2048,
                    hopSize = 512;
                for (let i = 0; i < channelData.length - windowSize; i += hopSize) {
                    const vec = new wasmModule.VectorDouble();
                    for (let j = 0; j < windowSize; j++) vec.push_back(channelData[i + j]);

                    const desc = oscofo.get_audio_description(vec);
                    const frame = { time: i / audioBuffer.sampleRate };
                    descriptorList.forEach((k) => (frame[k] = desc[k]));
                    analyzedData.push(frame);
                    vec.delete();

                    if (analyzedData.length % 100 === 0) {
                        status.innerText = `Analyzing... ${((i / channelData.length) * 100).toFixed(0)}%`;
                        await new Promise((r) => setTimeout(r, 0));
                    }
                }

                status.innerText = "Ready.";
                document.querySelectorAll(".ctrl-btn").forEach((b) => (b.disabled = false));
                updatePlot();
            }

            OpenScofo().then(async (mod) => {
                wasmModule = mod;
                oscofo = new mod.OpenScofo(44100, 2048, 512);
                document.getElementById("status").innerText = "Loading Canticos...";

                const res = await fetch("./canticos.mp3");
                const buffer = await res.arrayBuffer();
                analyzeAudio(buffer, "audio/mp3");
            });

            document.getElementById("audioUpload").addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (file) analyzeAudio(await file.arrayBuffer(), file.type);
            });

            function togglePlay() {
                wavesurfer.playPause();
            }
        </script>
    </body>
</html>
